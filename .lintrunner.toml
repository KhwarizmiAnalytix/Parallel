[[linter]]
code = 'PYPIDEP'
include_patterns = ['pyproject.toml', 'setup.py', 'requirements*.txt']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--check-deps',
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'TYPEIGNORE'
include_patterns = ['**/*.py']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'build/**',
    '__pycache__/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '--pattern=type:.*ignore',
    '--linter-name=TYPEIGNORE',
    '--error-name=type ignore directive',
    '--error-description=Code has type ignore; review necessity.',
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'TYPENOSKIP'
include_patterns = ['mypy.ini']
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '--pattern=follow_imports\s*=\s*skip',
    '--linter-name=TYPENOSKIP',
    '--error-name=use of follow_imports = skip',
    '--error-description=follow_imports = skip is forbidden from mypy.ini; it is too easy to accidentally turn off type checking. Use a top level # mypy: ignore-errors or per-site # type: ignore instead.',
    '--',
    '@{{PATHSFILE}}',
]

