[[linter]]
code = 'BAZEL_LINTER'
include_patterns = ['**/WORKSPACE', '**/WORKSPACE.bazel', '**/MODULE.bazel', '**/*.bzl']
exclude_patterns = [
    'ThirdParty/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.bazel_linter',
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'TPINCLUDE'
# Quoted #include of a ThirdParty / well-known external header. Project
# headers stay quoted (Parallel/... paths); vendored/system libraries use
# angle brackets.
include_patterns = [
    'Parallel/**/*.h',
    'Parallel/**/*.hxx',
    'Parallel/**/*.cpp',
    'Testing/**/*.h',
    'Testing/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '''--pattern=#include[[:space:]]+"(fmt/|gtest/|gmock/|benchmark/|tbb/|TBB/|oneapi/tbb|omp\.h)''',
    '''--replace-pattern=s/#include([[:blank:]]+)"((fmt|gtest|gmock|benchmark|tbb|TBB|oneapi\/tbb)\/[^"]+|omp\.h)"/#include\1<\2>/''',
    '--linter-name=TPINCLUDE',
    '--error-name=quoted third-party include',
    """--error-description=\
        Third-party headers must use angle brackets \
        (`#include <fmt/format.h>`), not quotes. Quotes are for project \
        headers only.\
    """,
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'RUFF'
include_patterns = [
    'Scripts/**/*.py',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.ruff_linter',
    '--config=pyproject.toml',
    '--show-disable',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--dry-run={{DRYRUN}}',
    'ruff==0.13.1',
]
is_formatter = true

[[linter]]
code = 'EXEC'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '**/*.so',
    '**/*.py',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.exec_linter',
    '--',
    '@{{PATHSFILE}}',
]
