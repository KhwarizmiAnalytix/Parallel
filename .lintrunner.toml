[[linter]]
code = 'CLANGFORMAT'
include_patterns = [
    'Parallel/**/*.h',
    'Parallel/**/*.hxx',
    'Parallel/**/*.cpp',
    'Parallel/**/*.cxx',
    'Testing/**/*.h',
    'Testing/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.s3_init',
    '--linter=clang-format',
    '--dry-run={{DRYRUN}}',
    '--output-dir=.lintbin',
    '--output-name=clang-format',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.clangformat_linter',
    '--binary=.lintbin/clang-format',
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'CLANGTIDY'
include_patterns = [
    'Parallel/**/*.h',
    'Parallel/**/*.hxx',
    'Parallel/**/*.cpp',
    'Testing/**/*.h',
    'Testing/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
]
# Resolves clang-tidy from PATH — see the note on this same choice in
# .clang-tidy / Cmake/clang_tidy.cmake: a pinned binary a few major versions
# behind the toolchain that built compile_commands.json breaks with bogus
# "system header not found" errors.
command = [
    'python3',
    '-m',
    'lint_tool.adapters.clangtidy_linter',
    '--binary=clang-tidy',
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'CODESPELL'
include_patterns = ['**']
exclude_patterns = [
    '.lintrunner.toml',
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    'Scripts/suppressions/spell_suppressions.txt',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.codespell_linter',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--dry-run={{DRYRUN}}',
    'codespell[toml]==2.4.1',
]

[[linter]]
code = 'NEWLINE'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '**/*.png',
    '**/*.ico',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.newlines_linter',
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'SPACES'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '--pattern=[[:blank:]]$',
    '--linter-name=SPACES',
    '--error-name=trailing spaces',
    '--replace-pattern=s/[[:blank:]]+$//',
    """--error-description=\
        This line has trailing spaces; please remove them.\
    """,
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'TABS'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '.gitmodules',
    # Needs a literal tab in its own --pattern below to detect tabs at all —
    # excluded the same way in XSigma's .lintrunner.toml, for the same reason.
    '.lintrunner.toml',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    # @lint-ignore TXT2
    '--pattern=	',
    '--linter-name=TABS',
    '--error-name=saw some tabs',
    '--replace-pattern=s/\t/    /',
    """--error-description=\
        This line has tabs; please replace them with spaces.\
    """,
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'CMAKE'
include_patterns = [
    "**/*.cmake",
    "**/CMakeLists.txt",
