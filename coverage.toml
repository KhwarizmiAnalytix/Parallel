# Host config for coverage-tool
# https://github.com/KhwarizmiAnalytix/coverage-tool

[coverage]
filter = "."
source_folder = "."
output_format = "html-and-json"
coverage_report_dir = "coverage_report"
min_coverage = 75.0
# Parallel builds one flat library (libParallel.*) + one test executable
# (ParallelCxxTests) across Parallel/common/, Parallel/tools/, Parallel/std_thread/,
# Parallel/openmp/, Parallel/tbb/ rather than XSigma's per-directory
# Library/<Module> layout. Without this override,
# discover_modules() treats each source subdirectory as its own "module" and
# looks for a matching lib<dir>.* + <dir>CxxTests — which only exist for
# "Parallel" itself. The GCC/lcov backend ignores `modules` (whole-build-dir
# capture) so CI's gcc job masked this; the Clang/LLVM backend (the default
# here and for local dev) needs the explicit override to find the real
# library and test binary.
modules = ["Parallel"]

[coverage.exclude]
patterns = [
    "*ThirdParty*",
    "*Testing*",
    "/usr/*",
]
llvm_ignore_regex = [
    ".*Testing[/\\\\].*",
    ".*ThirdParty[/\\\\].*",
]
