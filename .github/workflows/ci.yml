name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CMake build + CTest across platforms/compilers/configurations.
  # ---------------------------------------------------------------------------
  cmake:
    name: cmake (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-debug
            os: ubuntu-latest
            build_type: Debug
            compiler: gcc
          - name: ubuntu-gcc-release
            os: ubuntu-latest
            build_type: Release
            compiler: gcc
          - name: ubuntu-clang-debug
            os: ubuntu-latest
            build_type: Debug
            compiler: clang
          - name: ubuntu-clang-release
            os: ubuntu-latest
            build_type: Release
            compiler: clang
          - name: macos-debug
            os: macos-latest
            build_type: Debug
            compiler: ""
          - name: macos-release
            os: macos-latest
            build_type: Release
            compiler: ""
          - name: windows-debug
            os: windows-latest
            build_type: Debug
            compiler: ""
          - name: windows-release
            os: windows-latest
            build_type: Release
            compiler: ""
          # Static builds — exercises PARALLEL_STATIC_DEFINE and the static link
          # path, which the shared-default entries above never reach.
          - name: ubuntu-gcc-static-release
            os: ubuntu-latest
            build_type: Release
            compiler: gcc
            extra_cmake_flags: "--static"
          - name: windows-static-release
            os: windows-latest
            build_type: Release
            compiler: ""
            extra_cmake_flags: "--static"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}
          --testing=ON
          --benchmark=ON
          ${{ matrix.extra_cmake_flags }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build --architecture x64
          --build-type=${{ matrix.build_type }}
          --testing=ON
          --benchmark=ON
          ${{ matrix.extra_cmake_flags }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type ${{ matrix.build_type }} --parallel=4

      - name: Test
        working-directory: build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-type ${{ matrix.build_type }} --test-timeout 300

  # ---------------------------------------------------------------------------
  # Non-default SMP backends (std is covered by the matrix above), across every
  # platform and build type so a backend can't silently fall back to std when
  # its library isn't found (Cmake/openmp.cmake and tbb_multithreading.cmake
  # both disable the backend — and its sources — instead of failing).
  # ---------------------------------------------------------------------------
  cmake-backends:
    name: cmake-backends (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-openmp-debug
            os: ubuntu-latest
            backend: openmp
            build_type: Debug
          - name: ubuntu-openmp-release
            os: ubuntu-latest
            backend: openmp
            build_type: Release
          - name: ubuntu-tbb-debug
            os: ubuntu-latest
            backend: tbb
            build_type: Debug
          - name: ubuntu-tbb-release
            os: ubuntu-latest
            backend: tbb
            build_type: Release
          - name: macos-openmp-debug
            os: macos-latest
            backend: openmp
            build_type: Debug
          - name: macos-openmp-release
            os: macos-latest
            backend: openmp
            build_type: Release
          - name: macos-tbb-debug
            os: macos-latest
            backend: tbb
            build_type: Debug
          - name: macos-tbb-release
            os: macos-latest
            backend: tbb
            build_type: Release
          - name: windows-openmp-debug
            os: windows-latest
            backend: openmp
            build_type: Debug
          - name: windows-openmp-release
            os: windows-latest
            backend: openmp
            build_type: Release
          - name: windows-tbb-debug
            os: windows-latest
            backend: tbb
            build_type: Debug
          - name: windows-tbb-release
            os: windows-latest
            backend: tbb
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install backend dependencies (Linux TBB)
        if: matrix.backend == 'tbb' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev

      - name: Install backend dependencies (macOS TBB)
        if: matrix.backend == 'tbb' && runner.os == 'macOS'
        run: brew install tbb

      - name: Install backend dependencies (macOS OpenMP)
        if: matrix.backend == 'openmp' && runner.os == 'macOS'
        run: |
          brew install libomp
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # Windows TBB needs no explicit install step: tbb_multithreading.cmake
      # falls back to fetching and building oneTBB from source, which works
      # for MSVC (the default cl.exe toolchain on windows-latest) — only the
      # Windows+Clang combination requires a pre-installed system TBB, and
      # this matrix doesn't build with Clang on Windows. Windows OpenMP needs
      # no setup either: MSVC has built-in /openmp support that CMake's
      # FindOpenMP detects directly.

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          args=(--compiler=default --source-dir . --build-dir build --generator Ninja
                --build-type=${{ matrix.build_type }}
                --backend=${{ matrix.backend }}
                --testing=ON
                --benchmark=OFF)
          if [ "${{ matrix.backend }}" = "openmp" ] && [ "${{ runner.os }}" = "macOS" ]; then
            # AppleClang has no native OpenMP; point FindOpenMP at Homebrew's
            # libomp explicitly (the standard workaround — FindOpenMP can't
            # locate it on its own).
            args+=(--openmp-flags="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include")
            args+=(--openmp-libraries=omp)
            args+=(--openmp-library="${LIBOMP_PREFIX}/lib/libomp.dylib")
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config "${args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build --architecture x64
          --backend=${{ matrix.backend }}
          --testing=ON
          --benchmark=OFF

      - name: Verify backend was actually selected
        shell: bash
        run: |
          flag="PARALLEL_ENABLE_${{ matrix.backend == 'openmp' && 'OPENMP' || 'TBB' }}"
          if ! grep -qi "^${flag}:BOOL=ON" build/CMakeCache.txt; then
            echo "::error::${flag} is not ON in CMakeCache.txt — find_package fell back to the std backend instead of failing. Check the dependency install step for this job."
            exit 1
          fi

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type ${{ matrix.build_type }} --parallel=4

      - name: Test
        working-directory: build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-type ${{ matrix.build_type }} --test-timeout 300

  # ---------------------------------------------------------------------------
  # Compiler-cache and Icecream (icecc) coverage across platforms. Exercises
  # PARALLEL_ENABLE_CACHE/PARALLEL_CACHE_BACKEND (ccache, sccache) and
  # PARALLEL_ENABLE_ICECC so broken cache/icecc wiring (Cmake/cache.cmake,
  # Cmake/helper_macros.cmake) fails CI instead of only showing up on a
  # developer's machine. Windows entries use Ninja + a vcvars-initialized
  # cl.exe rather than this repo's usual --architecture x64 VS generator: CMake's
  # COMPILER_LAUNCHER property is only honored by the Makefile/Ninja
  # generators, so the VS generator would silently no-op the launcher and the
  # job would pass without testing anything. Icecc has no Windows port
  # (Icecream isn't packaged for Windows), so there is no windows-icecc entry.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: cache-icecc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
            icecc: false
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
            icecc: false
          - name: linux-icecc
            os: ubuntu-latest
            backend: none
            icecc: true
          - name: macos-ccache
            os: macos-latest
            backend: ccache
            icecc: false
          - name: macos-sccache
            os: macos-latest
            backend: sccache
            icecc: false
          - name: macos-icecc
            os: macos-latest
            backend: none
            icecc: true
          - name: windows-ccache
            os: windows-latest
            backend: ccache
            icecc: false
          - name: windows-sccache
            os: windows-latest
            backend: sccache
            icecc: false
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
            icecc: false
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
            icecc: false
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
            icecc: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install ccache/icecc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache icecc

      - name: Install ccache/icecream (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.backend == 'sccache'
        with:
          version: v0.12.0
          disable_annotations: 'true'

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - name: Select compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          args=(--compiler=default --source-dir . --build-dir build --generator Ninja
                --build-type=Release
                --testing=ON
                --benchmark=OFF)
          if [ "${{ matrix.icecc }}" = "true" ]; then
            args+=(--icecc=ON --cache=OFF)
          else
            args+=(--cache=ON --cache-backend=${{ matrix.backend }})
            # Release defaults to LTO, which Cmake/lto.cmake rejects with sccache.
            if [ "${{ matrix.backend }}" = "sccache" ]; then
              args+=(--lto-mode=off)
            fi
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config "${args[@]}"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release --parallel=4

      - name: Test
        working-directory: build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-type Release --test-timeout 300

      - name: Stop sccache server
        if: always() && matrix.backend == 'sccache'
        shell: bash
        run: sccache --stop-server || true

  # ---------------------------------------------------------------------------
  # Bazel build + test (parity check against the CMake build).
  # Matrix covers: platforms (Linux, macOS), compilation modes (fastbuild, opt),
  # SMP backends (std, tbb, openmp), and the shared-libs config_setting — each
  # targeting a code path in BUILD.bazel / parallel.bzl that only one combination
  # exercises (macOS linkopts, Windows copts, TBB selects.with_or, shared defines).
  # Windows Bazel is excluded: the windows-latest runner's Bazel setup is
  # significantly slower and the Windows-specific copts are covered by CMake CI.
  # ---------------------------------------------------------------------------
  bazel:
    name: bazel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-std-fastbuild
            os: ubuntu-latest
            mode: fastbuild
            backend: std
            shared: "false"
          - name: ubuntu-std-opt
            os: ubuntu-latest
            mode: opt
            backend: std
            shared: "false"
          - name: ubuntu-tbb-fastbuild
            os: ubuntu-latest
            mode: fastbuild
            backend: tbb
            shared: "false"
          - name: ubuntu-openmp-fastbuild
            os: ubuntu-latest
            mode: fastbuild
            backend: openmp
            shared: "false"
          # shared_libs config_setting — exercises PARALLEL_SHARED_DEFINE /
          # PARALLEL_BUILDING_DLL local_define and linkstatic=False path.
          - name: ubuntu-shared-fastbuild
            os: ubuntu-latest
            mode: fastbuild
            backend: std
            shared: "true"
          # macOS: exercises the platform-specific -undefined dynamic_lookup
          # linkopts branch and verifies AppleClang builds clean.
          - name: macos-std-fastbuild
            os: macos-latest
            mode: fastbuild
            backend: std
            shared: "false"
          - name: macos-tbb-fastbuild
            os: macos-latest
            mode: fastbuild
            backend: tbb
            shared: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.mode }}-${{ matrix.shared }}-${{ hashFiles('MODULE.bazel', 'WORKSPACE.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.mode }}-
            bazel-${{ runner.os }}-

      - name: Build
        # Scoped to our own packages: "//..." would also descend into the vendored
        # ThirdParty/benchmark/tools package, which needs rules_python (not a
        # dependency of this repo's Bazel build).
        shell: bash
        run: |
          args=(--compiler=default --compilation-mode=${{ matrix.mode }})
          [[ "${{ matrix.backend }}" != "std" ]] && args+=(backend.${{ matrix.backend }})
          [[ "${{ matrix.shared }}" == "true" ]] && args+=(shared)
          args+=(--target=//:Parallel --target=//Testing/...)
          python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build "${args[@]}"

      - name: Test
        shell: bash
        run: |
          args=(--compiler=default --compilation-mode=${{ matrix.mode }} --test-output=errors)
          [[ "${{ matrix.backend }}" != "std" ]] && args+=(backend.${{ matrix.backend }})
          [[ "${{ matrix.shared }}" == "true" ]] && args+=(shared)
          args+=(--target=//Testing/...)
          python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test "${args[@]}"
