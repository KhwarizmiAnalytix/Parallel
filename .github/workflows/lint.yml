name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install codespell
        run: pip install --user codespell

      - name: Run codespell
        run: >
          codespell
          --ignore-words=Scripts/suppressions/spell_suppressions.txt
          --skip=".git,.github,ThirdParty,build,bazel-*"
