name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lintrunner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy

      - name: Configure (produces compile_commands.json for CLANGTIDY)
        # Testing + Benchmark ON so every source file lintrunner should check
        # (library, tests, benchmarks) is actually part of the build.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPARALLEL_ENABLE_TESTING=ON
          -DPARALLEL_ENABLE_BENCHMARK=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lintrunner
        # typing_extensions: lint_tool's adapters._linter package imports it directly but
        # lint-tool declares no dependencies at all, so it's missing on a clean install.
        run: pip install lintrunner lint-tool typing_extensions

      - name: Initialize lintrunner (downloads/pins clang-format, actionlint, pip tools)
        run: lintrunner init

      - name: Run lintrunner
        run: lintrunner --all-files --force-color
